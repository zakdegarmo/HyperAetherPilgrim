<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Link Explorer (Fractal)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
    }
    #hud {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      background: rgba(0,0,0,0.5);
      padding: 5px 10px;
      font-size: 12px;
      line-height: 1.4;
      color: #fff;
    }
    #tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
      z-index: 3;
      max-width: 300px;
    }
    input, button {
      padding: 5px;
      font-size: 14px;
    }
  </style>
  <script src="https://unpkg.com/three@0.152.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.152.0/examples/js/lines/LineGeometry.js"></script>
  <script src="https://unpkg.com/three@0.152.0/examples/js/lines/LineMaterial.js"></script>
  <script src="https://unpkg.com/three@0.152.0/examples/js/lines/Line2.js"></script>
  <script src="https://unpkg.com/three@0.152.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="ui">
    <input id="urlInput" placeholder="Enter URL" size="30" />
    <button id="go">Go</button>
  </div>
  <div id="hud">Initializing...</div>
  <div id="tooltip"></div>
  <script src="fractal-logic.js"></script>
</body>
</html>
